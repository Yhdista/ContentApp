name: Verify
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  desktop-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Desktop display and Skia runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libfontconfig1 libfreetype6 libx11-6 libxext6 libxi6 libxrender1 libxtst6 fonts-dejavu-core
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Boundaries, negative fixtures and public design system consumer
        run: ./gradlew verifyArchitecture testArchitectureGuard :verification:designsystem-consumer:compileCommonMainKotlinMetadata :verification:designsystem-consumer:compileKotlinDesktop
      - name: Desktop and shared Android host tests
        run: xvfb-run -a ./gradlew desktopTest testAndroidHostTest :androidApp:testDebugUnitTest
      - name: Debug application and instrumentation source compile
        run: ./gradlew :androidApp:assembleDebug :androidApp:compileDebugAndroidTestKotlin
      - name: Android application lint
        run: ./gradlew lintAndroidMain :androidApp:lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-and-debug-apk
          path: |
            **/build/reports/tests/
            androidApp/build/outputs/apk/debug/*.apk
  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK for multiplatform configuration
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Apple Silicon simulator compile
        run: ./gradlew :composeApp:compileKotlinIosSimulatorArm64
